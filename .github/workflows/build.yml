name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.11"

      - name: Decide whether to publish a release
        id: rel
        shell: bash
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          PUBLISH=false
          if [[ "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            PUBLISH=true
            echo "New version $V - will publish a release if everything passes."
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Download the handwriting font (Kalam, SIL Open Font License)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force web/fonts | Out-Null
          foreach ($f in "Kalam-Regular.ttf", "Kalam-Bold.ttf", "OFL.txt") {
            Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/kalam/$f" -OutFile "web/fonts/$f"
          }
          Get-ChildItem web/fonts | ForEach-Object { "{0}  {1:N0} KB" -f $_.Name, ($_.Length / 1KB) }

      - name: Tests (notebook on disk, what the X does)
        run: |
          python tests/test_store.py
          python tests/test_close.py

      - name: Build exe
        run: pyinstaller NiSHNotes.spec --noconfirm

      - name: Mark the app's files as downloaded, like unzipping in Explorer does
        shell: pwsh
        timeout-minutes: 3
        run: |
          # the .NET parts that refuse to load when marked. Not the exe: a marked exe makes Windows ask
          # "run this unknown app?" first (you click Run once on your own computer), which no one can click here.
          $app = "dist\NiSH Notes"
          $files = @(Get-ChildItem "$app\_internal" -Recurse -File -Include *.dll | Where-Object { $_.FullName -match 'pythonnet|clr_loader|webview' })
          foreach ($f in $files) { Set-Content -LiteralPath $f.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          Write-Output "marked $($files.Count) files"

      - name: Without the fix, from marked files (shown, not required)
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $env:NN_NO_UNBLOCK = "1"
          $out = Join-Path $PWD "blocked-check"
          $p = Start-Process -FilePath "dist\NiSH Notes\NiSHNotes.exe" -ArgumentList "--smoketest", "`"$out`"" -PassThru
          if ($p.WaitForExit(45000)) { Write-Output "without unblocking: exit code $($p.ExitCode)" }
          else { Write-Output "without unblocking: still running after 45 s (most likely the error message box)" }
          Get-Process NiSHNotes -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: GUI smoke test (opens the window and clicks through everything)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $out = Join-Path $PWD "gui-smoke"
          $p = Start-Process -FilePath "dist\NiSH Notes\NiSHNotes.exe" -ArgumentList "--smoketest", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); $timedOut = $true }
          $report = ""
          if (Test-Path "$out\gui_smoketest.txt") { $report = Get-Content "$out\gui_smoketest.txt" -Raw }
          Write-Output $report
          if ($timedOut -or $p.ExitCode -ne 0 -or $report -notmatch "GUI SMOKETEST PASSED") {
            $msg = ("timedOut=$timedOut exit=$($p.ExitCode)`n" + $report) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=gui-smoketest::$msg"
            throw "GUI smoke test failed"
          }
          $short = (($report -replace "`r", "" -split "`n") | Where-Object { $_ -match "^ok" }) -join "%0A"
          Write-Output "::notice title=gui-smoketest::$short"
          Compress-Archive -Path "dist\NiSH Notes" -DestinationPath "dist\NiSH-Notes-windows.zip" -Force
          "{0:N1} MB zipped" -f ((Get-Item "dist\NiSH-Notes-windows.zip").Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: NiSH-Notes-windows
          path: dist/NiSH-Notes-windows.zip
          retention-days: 14

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NiSH Notes ${{ steps.rel.outputs.tag }}
          body: "Download **NiSH-Notes-windows.zip** below, unzip it anywhere (right-click → Extract All), and start **NiSHNotes.exe** in the folder. No installer, no admin rights. Your notes stay where they were."
          make_latest: true
          files: dist/NiSH-Notes-windows.zip
