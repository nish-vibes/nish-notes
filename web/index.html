<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiSH Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="font-hand">
<div class="app">
  <main class="sheet" aria-label="Page">
    <header class="sheet-head">
      <div class="head-text">
        <span class="folder-label" id="folderLabel"></span>
        <label class="sr-only" for="title">Page title</label>
        <input id="title" class="title" type="text" autocomplete="off" spellcheck="false" placeholder="Untitled">
      </div>
      <div class="head-tools">
        <span class="date" id="date"></span>
        <span class="status" id="status" data-state="saved">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <span id="statusText">Saved</span>
        </span>
        <button type="button" class="icon-btn" id="fontBtn" title="Switch between handwriting and plain text" aria-label="Switch font">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 9.5 5h1L16 20M6.5 14h7"/><path d="M17 12.5c1-1 3.5-1 3.5 1.2V20M20.5 16.5c-3 0-4 .6-4 1.9 0 2 3.2 2 4-.2"/></svg>
        </button>
        <button type="button" class="icon-btn" id="deletePageBtn" title="Delete page" aria-label="Delete page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        </button>
      </div>
    </header>
    <div class="paper">
      <div class="holes" aria-hidden="true"><span></span><span></span><span></span></div>
      <label class="sr-only" for="editor">Page text</label>
      <textarea id="editor" class="editor" spellcheck="true"></textarea>
      <div class="empty" id="empty" hidden>
        <p>No page open.</p>
        <button type="button" class="primary" id="emptyNew">New page</button>
      </div>
    </div>
  </main>

  <aside class="side" aria-label="Folders">
    <div class="side-head">
      <h2>Folders</h2>
      <div class="side-tools">
        <button type="button" class="icon-btn" id="newFolderBtn" title="New folder (Ctrl+Shift+N)" aria-label="New folder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10.5v6M9 13.5h6"/></svg>
        </button>
        <button type="button" class="icon-btn" id="moreBtn" title="More" aria-label="More options" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        </button>
      </div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr-only">Search pages</span>
      <input id="search" type="search" placeholder="Search pages" autocomplete="off" spellcheck="false">
    </label>
    <nav class="tree" id="tree"></nav>
    <button type="button" class="primary new-page" id="newPageBtn" title="New page (Ctrl+N)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New page
    </button>
  </aside>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="modal-back" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="modal-buttons">
      <button type="button" class="ghost" id="modalCancel">Cancel</button>
      <button type="button" class="danger" id="modalOk">Delete</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
